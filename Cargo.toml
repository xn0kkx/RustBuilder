[workspace]
resolver = "2"
members = ["crates/common", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pgp = "0.13"
rand = "0.8"
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[profile.release]
opt-level = 3
lto = true
